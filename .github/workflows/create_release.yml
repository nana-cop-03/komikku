name: Create Release from Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag/version (e.g., v1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release name (e.g., Nana Comik v1.0.0)'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: true
      send_telegram:
        description: 'Send to Telegram'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: 'ubuntu-24.04'
    outputs:
      APK_UNIVERSAL_SHA: ${{ steps.get_sha.outputs.APK_UNIVERSAL_SHA }}
      APK_ARM64_V8A_SHA: ${{ steps.get_sha.outputs.APK_ARM64_V8A_SHA }}
      APK_ARMEABI_V7A_SHA: ${{ steps.get_sha.outputs.APK_ARMEABI_V7A_SHA }}
      APK_X86_SHA: ${{ steps.get_sha.outputs.APK_X86_SHA }}
      APK_X86_64_SHA: ${{ steps.get_sha.outputs.APK_X86_64_SHA }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: 17
          distribution: temurin

      - name: Write google-services.json
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/google-services.json
          contents: '{}'
          write-mode: overwrite

      - name: Write client_secrets.json
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/src/main/assets/client_secrets.json
          contents: '{}'
          write-mode: overwrite

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > app/nanacomik.keystore

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5

      - name: Build app
        run: ./gradlew assembleRelease -Penable-updater
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          path: "**/*.apk"
          retention-days: 1

      - name: Get SHA & clean up build artifacts
        id: get_sha
        run: |
          set -e

          # Find and move universal APK
          if [ -f "app/build/outputs/apk/release/app-universal-release.apk" ]; then
            mv app/build/outputs/apk/release/app-universal-release.apk Nana-Comik-${{ inputs.release_tag }}.apk
            sha=`sha256sum Nana-Comik-${{ inputs.release_tag }}.apk | awk '{ print $1 }'`
            echo "APK_UNIVERSAL_SHA=$sha" >> $GITHUB_OUTPUT
          fi

          # Find and move arm64-v8a APK
          if [ -f "app/build/outputs/apk/release/app-arm64-v8a-release.apk" ]; then
            mv app/build/outputs/apk/release/app-arm64-v8a-release.apk Nana-Comik-arm64-v8a-${{ inputs.release_tag }}.apk
            sha=`sha256sum Nana-Comik-arm64-v8a-${{ inputs.release_tag }}.apk | awk '{ print $1 }'`
            echo "APK_ARM64_V8A_SHA=$sha" >> $GITHUB_OUTPUT
          fi

          # Find and move armeabi-v7a APK
          if [ -f "app/build/outputs/apk/release/app-armeabi-v7a-release.apk" ]; then
            mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk Nana-Comik-armeabi-v7a-${{ inputs.release_tag }}.apk
            sha=`sha256sum Nana-Comik-armeabi-v7a-${{ inputs.release_tag }}.apk | awk '{ print $1 }'`
            echo "APK_ARMEABI_V7A_SHA=$sha" >> $GITHUB_OUTPUT
          fi

          # Find and move x86 APK
          if [ -f "app/build/outputs/apk/release/app-x86-release.apk" ]; then
            mv app/build/outputs/apk/release/app-x86-release.apk Nana-Comik-x86-${{ inputs.release_tag }}.apk
            sha=`sha256sum Nana-Comik-x86-${{ inputs.release_tag }}.apk | awk '{ print $1 }'`
            echo "APK_X86_SHA=$sha" >> $GITHUB_OUTPUT
          fi

          # Find and move x86_64 APK
          if [ -f "app/build/outputs/apk/release/app-x86_64-release.apk" ]; then
            mv app/build/outputs/apk/release/app-x86_64-release.apk Nana-Comik-x86_64-${{ inputs.release_tag }}.apk
            sha=`sha256sum Nana-Comik-x86_64-${{ inputs.release_tag }}.apk | awk '{ print $1 }'`
            echo "APK_X86_64_SHA=$sha" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name || format('Nana Comik {0}', inputs.release_tag) }}
          body: |
            [![GitHub downloads](https://img.shields.io/github/downloads/komikku-app/komikku/${{ inputs.release_tag }}/total?label=Downloaded&labelColor=27303D&color=0D1117&logo=github&logoColor=FFFFFF&style=flat)](https://github.com/komikku-app/komikku/releases/${{ inputs.release_tag }})

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ steps.get_sha.outputs.APK_UNIVERSAL_SHA }} |
            | arm64-v8a | ${{ steps.get_sha.outputs.APK_ARM64_V8A_SHA }} |
            | armeabi-v7a | ${{ steps.get_sha.outputs.APK_ARMEABI_V7A_SHA }} |
            | x86 | ${{ steps.get_sha.outputs.APK_X86_SHA }} |
            | x86_64 | ${{ steps.get_sha.outputs.APK_X86_64_SHA }} |

            ### If you are unsure which apk to download then go with `Nana-Comik-${{ inputs.release_tag }}.apk`
          files: |
            Nana-Comik-${{ inputs.release_tag }}.apk
            Nana-Comik-arm64-v8a-${{ inputs.release_tag }}.apk
            Nana-Comik-armeabi-v7a-${{ inputs.release_tag }}.apk
            Nana-Comik-x86-${{ inputs.release_tag }}.apk
            Nana-Comik-x86_64-${{ inputs.release_tag }}.apk
          draft: ${{ inputs.draft }}
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Release APKs to Telegram
        if: inputs.send_telegram && success()
        run: |
          # Send universal APK
          if [ -f "Nana-Comik-${{ inputs.release_tag }}.apk" ]; then
            python3 scripts/send-to-telegram.py \
              "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              "${{ secrets.TELEGRAM_CHAT_ID }}" \
              "Nana-Comik-${{ inputs.release_tag }}.apk" \
              "${{ inputs.release_tag }}" \
              "release-universal"
          fi

          # Send arm64-v8a APK
          if [ -f "Nana-Comik-arm64-v8a-${{ inputs.release_tag }}.apk" ]; then
            python3 scripts/send-to-telegram.py \
              "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
              "${{ secrets.TELEGRAM_CHAT_ID }}" \
              "Nana-Comik-arm64-v8a-${{ inputs.release_tag }}.apk" \
              "${{ inputs.release_tag }}" \
              "release-arm64"
          fi
